name = "microchat-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
RP_ID = "localhost"
RP_NAME = "MicroChat"
RP_ORIGIN = "http://localhost:3000"
CLOUDFLARE_CALLS_APP_ID = "..."
CLOUDFLARE_CALLS_TOKEN = "..."
ICE_FALLBACK_SERVERS = "[]"

[env.production.vars]
RP_ID = "microchat.smoxu.com"
RP_NAME = "MicroChat"
RP_ORIGIN = "https://microchat.smoxu.com"
CLOUDFLARE_CALLS_APP_ID = "..."
CLOUDFLARE_CALLS_TOKEN = "..."
## ICE_FALLBACK_SERVERS is set via `wrangler secret` for production

[[d1_databases]]
binding = "DB"
database_name = "microchat-db"
database_id = "a5b418d2-f9f5-4bdc-a1c8-f0c0d5a4f2af"
migrations_dir = "src/db/migrations"

[[env.production.d1_databases]]
binding = "DB"
database_name = "microchat-db"
database_id = "a5b418d2-f9f5-4bdc-a1c8-f0c0d5a4f2af"
migrations_dir = "src/db/migrations"

[durable_objects]
bindings = [
  { name = "CHAT_HUB", class_name = "ChatHub" }
]

[env.production.durable_objects]
bindings = [
  { name = "CHAT_HUB", class_name = "ChatHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatHub"]

[triggers]
crons = ["0 3 * * *"]

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "microchat-images"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "microchat-images"
