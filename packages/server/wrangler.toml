name = "microchat-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
RP_ID = "localhost"
RP_NAME = "MicroChat"
RP_ORIGIN = "http://localhost:3000"

[env.production.vars]
RP_ID = "microchat.example.com"
RP_NAME = "MicroChat"
RP_ORIGIN = "https://microchat.example.com"

[[d1_databases]]
binding = "DB"
database_name = "microchat-db"
database_id = "placeholder-replace-with-actual-id"

[triggers]
crons = ["0 3 * * *"]
