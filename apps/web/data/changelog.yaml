- category: Privacy & Security
  icon: shield
  color: blue
  items:
    - date: Feb 21, 2026
      title: Live Voice Calls
      description: >
        Jump into real-time, end-to-end encrypted voice calls with your groups. 
        Your calls are routed securely and anonymously, protecting your privacy just like your messages.
    - date: Feb 19, 2026
      title: Secure Logout
      description: >
        You can now easily and securely log out of your session directly from the app, 
        ensuring your account stays safe on shared devices.
    - date: Feb 16, 2026
      title: End-to-End Encryption
      description: >
        All group messages are now protected with AES-256-GCM encryption.
        Nobody but your group members can read what you send.
    - date: Feb 12, 2026
      title: Passwordless Login (WebAuthn)
      description: >
        We abandoned passwords. You can now register and log in securely
        using your device's built-in passkeys or biometrics.
    - date: Feb 10, 2026
      title: Ghost Courier (Sealed Sender)
      description: >
        Your messages are now routed anonymously. Our servers can no longer
        see who is sending a message—you act as a ghost.
    - date: Feb 05, 2026
      title: Ephemeral Storage
      description: >
        Server-side messages are deleted immediately after successful
        delivery to all recipients. No long-term logs kept.
    - date: Feb 01, 2026
      title: Transparent Security
      description: >
        We launched interactive Protocol and Security pages with Simple and
        Engineer modes, breaking down our zero-trust architecture.

