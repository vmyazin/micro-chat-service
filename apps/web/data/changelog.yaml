- category: Privacy & Security
  icon: shield
  color: blue
  items:
    - date: Feb 27, 2026
      title: Stronger Per-Message Encryption
      description: >
        Every single message you send is now protected with its own unique
        encryption key. Even if one key were ever exposed, your other messages
        would remain completely safe.
    - date: Feb 27, 2026
      title: Clearer Encryption Setup
      description: >
        If your encryption keys ever need to be configured, you'll now see a
        clear explanation of what's happening and a one-tap option to fix it —
        no confusion, no dead ends.
    - date: Feb 21, 2026
      title: Live Voice Calls
      description: >
        Jump into real-time, end-to-end encrypted voice calls with your groups. 
        Your calls are routed securely and anonymously, protecting your privacy just like your messages.
    - date: Feb 19, 2026
      title: Secure Logout
      description: >
        You can now easily and securely log out of your session directly from the app, 
        ensuring your account stays safe on shared devices.
    - date: Feb 16, 2026
      title: End-to-End Encryption
      description: >
        All group messages are now protected with AES-256-GCM encryption.
        Nobody but your group members can read what you send.
    - date: Feb 12, 2026
      title: Passwordless Login (WebAuthn)
      description: >
        We abandoned passwords. You can now register and log in securely
        using your device's built-in passkeys or biometrics.
    - date: Feb 10, 2026
      title: Ghost Courier (Sealed Sender)
      description: >
        Your messages are now routed anonymously. Our servers can no longer
        see who is sending a message—you act as a ghost.
    - date: Feb 05, 2026
      title: Ephemeral Storage
      description: >
        Server-side messages are deleted immediately after successful
        delivery to all recipients. No long-term logs kept.
    - date: Feb 01, 2026
      title: Transparent Security
      description: >
        We launched interactive Protocol and Security pages with Simple and
        Engineer modes, breaking down our zero-trust architecture.

- category: Rich Media
  icon: image
  color: purple
  items:
    - date: Jan 28, 2026
      title: Image Upload & Pasting
      description: >
        Send pictures instantly! Paste images right from your clipboard or
        upload them securely, protected by our retention limits.
    - date: Jan 20, 2026
      title: Voice Messages
      description: >
        Sometimes text isn't enough. Record, send, and listen to encrypted
        voice messages right inside the chat window.

- category: Refined Experience
  icon: sparkles
  color: green
  items:
    - date: Feb 26, 2026
      title: QR Code Group Invites
      description: >
        Share your group with a scannable QR code. Open Group Settings and
        tap the QR icon to display it on screen, copy it, or save it as an
        image — whatever's easiest for you.
    - date: Feb 26, 2026
      title: Message Deletion Countdown
      description: >
        Hover over any message to see a live timer showing exactly how long
        until it's deleted from our servers. A small reminder that we keep
        nothing longer than necessary.
    - date: Feb 26, 2026
      title: Call Sound Effects
      description: >
        You'll now hear a connecting tone while waiting for someone to pick
        up, and a subtle sound when the call ends — so you always know where
        things stand without staring at the screen.
    - date: Feb 26, 2026
      title: Dark Mode & Themes
      description: >
        Easily switch between Light, Dark, or System mode to match your vibe.
        Your preference is remembered and applied beautifully across the app.
    - date: Feb 26, 2026
      title: Smarter Group Settings
      description: >
        Managing groups is smoother than ever with a new animated slide-in
        drawer, an enhanced member list, and a persistent active call bar.
    - date: Feb 25, 2026
      title: Global Languages & RTL
      description: >
        MicroChat goes global. We've added internationalization support, starting
        with Russian and Farsi (with full Right-To-Left layout support).
    - date: Feb 24, 2026
      title: User Profiles & Easy Invites
      description: >
        Your current username is now neatly displayed in the sidebar, and copying
        group invite links is faster and more reliable across devices.
    - date: Feb 22, 2026
      title: Real-time Online Status
      description: >
        Always know who's around to chat. We've added instant, real-time green
        dot indicators showing exactly which group members are currently online.
    - date: Feb 22, 2026
      title: Upgraded Voice Calls
      description: >
        Voice calls now feature a live duration timer, clear ringtones for
        incoming calls, and improved connection stability for a seamless experience.
    - date: Feb 20, 2026
      title: New Branding & Changelog
      description: >
        We introduced a fresh MicroChat logo across the website and added this 
        dedicated Changelog page so you can playfully track all our new updates.
    - date: Jan 15, 2026
      title: Real-time Messaging & Audio Cues
      description: >
        Real-time WebSocket connection guarantees instant delivery,
        complete with subtle sound effects for new messages and member joins.
    - date: Jan 10, 2026
      title: Dynamic Group Invites
      description: >
        Create private groups and share a simple invite link. New members
        can join instantly using a dedicated landing page.
    - date: Jan 05, 2026
      title: Chat UI Overhaul
      description: >
        We refined our chat layout: softer shadows, thinner borders, new
        avatar components, and visible sender names for better context.
    - date: Dec 28, 2025
      title: Message Controls
      description: >
        You're in full control. Highlight messages with a smart context
        menu or delete them on the fly.
    - date: Dec 20, 2025
      title: New Color System
      description: >
        We migrated to a beautiful CSS variable-based palette that
        perfectly balances contrast for stunning dark modes.
